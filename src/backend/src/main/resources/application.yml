spring:
  datasource:
    url: jdbc:mysql://localhost:3306/timetable?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${TANGENT_COMMON_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  flyway:
    locations: classpath:db/migration/{vendor}
    baseline-version: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

app:
  cors:
    # 允许的跨域来源（逗号分隔）。默认 *；认证走请求头而非 Cookie，故不开启凭据。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  # 可选的管理员 API Key 列表（逗号分隔）；优先使用数据库 account_role=ADMIN
  admin-api-keys: ${ADMIN_API_KEYS:}
  # 可选：空库的初始管理员凭据；未配置时由设备自动注册普通工作区
  bootstrap-key: ${TANGENT_BOOTSTRAP_KEY:}
  llm:
    # 当前启用的 LLM 提供方（AI Campus Agent V1.0 抽象层开关）。
    # deepseek = 走 DeepSeek 适配器；legacy-direct = 直接调用 DeepSeek（回滚开关，V1.0 行为等价）。
    # 未来新增 provider（如 OpenAI/通义）只需实现 LlmClient 并在此切换，业务代码零改动。
    # 未配置或不可用时会自动回退到任一已配置的 provider，全部不可用则返回 503。
    active-provider: ${APP_LLM_ACTIVE_PROVIDER:deepseek}
    # ------------------------------------------------------------------
    # 多 provider + 分级路由 + 故障降级（成本治理 6.1）
    # 默认三项都是空的，行为与 V1.0 完全一致（只有 DeepSeek）。想要能力就显式配。
    # ------------------------------------------------------------------
    # providers：除 DeepSeek 外再挂任意数量的 OpenAI 兼容服务（智谱 GLM / 通义 /
    # 豆包 / Moonshot / 自建网关）。键名即 providerId。**api-key 留空 = 未配置**，
    # 不参与激活也不参与降级，避免「配了地址没配 Key」的半吊子配置拖累主链路。
    # providers:
    #   glm:
    #     base-url: https://open.bigmodel.cn/api/paas/v4
    #     model: glm-4-flash
    #     api-key: ${GLM_API_KEY:}
    #     timeout-seconds: 120
    #     idle-timeout-seconds: 30
    #     max-tokens: 8192
    #     temperature: 0.2
    # routes：按场景指定 provider，把轻活切到便宜的 flash 级模型、重活留在主力模型。
    # 未列出的场景走 active-provider。key 取 CHAT / PLAN / EXTRACT / OCR / INBOX /
    # QUERY / REFINE / PARSE_HTML（大小写不敏感）。
    # routes:
    #   EXTRACT: glm
    #   OCR: glm
    # fallback：主 provider 调用失败时的备用链，按顺序各试一次。
    # 流式只在「一个字都还没吐出去」时才切换，避免前端收到两份正文。
    # fallback:
    #   - glm
    fallback-enabled: ${APP_LLM_FALLBACK_ENABLED:true}
    # 计划生成失败重试退避（成本治理 6.1 #6）。
    # 只对「模型输出没通过服务端校验(502) / 上游超时繁忙(503,504) / 网络异常」重试；
    # 模板缺失、未配置 provider、写库失败这类重试也不会变的错误直接抛，不做无意义等待。
    # 退避 = initial-backoff-ms * 2^attempt + 随机抖动(≤jitter-ms)。
    # enabled=false 即退化为 V1.0 行为：一次失败直接冒到前端。
    plan-retry:
      enabled: ${APP_LLM_PLAN_RETRY_ENABLED:true}
      max-attempts: ${APP_LLM_PLAN_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${APP_LLM_PLAN_RETRY_INITIAL_BACKOFF_MS:800}
      max-backoff-ms: ${APP_LLM_PLAN_RETRY_MAX_BACKOFF_MS:4000}
      jitter-ms: ${APP_LLM_PLAN_RETRY_JITTER_MS:300}
    # 单价配置（成本治理 P0-1）。统计页的金额是**估算**，按这里的单价算。
    # 模型价格一定会变，所以做成配置而非硬编码；用环境变量覆盖便于不改代码调价：
    #   LLM_PRICE_INPUT / LLM_PRICE_OUTPUT / LLM_PRICE_INPUT_DEEPSEEK_FLASH
    # 取价顺序：models.<模型名> 精确匹配 → per-million 通用默认。
    pricing:
      currency: CNY
      per-million:
        input: ${LLM_PRICE_INPUT:0.5}
        output: ${LLM_PRICE_OUTPUT:2.0}
      models:
        deepseek-flash:
          input: ${LLM_PRICE_INPUT_DEEPSEEK_FLASH:0.5}
          output: ${LLM_PRICE_OUTPUT_DEEPSEEK_FLASH:2.0}
    # 月度预算与超限熔断（成本治理 P0-2）。
    # **默认不限制**：下面两项都不配置时完全不拦截。要熔断必须显式配额度——
    # 默认打开会让没配预算的人某天突然用不了 AI 且不知道为什么。
    # 额度按自然月结算，每月 1 号自动归零，无需定时任务。
    budget:
      # 全局月度上限（元）。所有场景合计，超了熔断全部 AI 功能。留空 = 不限。
      monthly-limit-cny: ${LLM_BUDGET_MONTHLY_CNY:}
      # 分场景月度上限（元）。某个场景超了**只熔断该场景**——对话超限不该让
      # 课表解析一起挂。key 取 CHAT / EXTRACT / INBOX / PLAN / REFINE / PARSE_HTML / OCR。
      scene-monthly-limits:
        chat: ${LLM_BUDGET_CHAT_CNY:}
        plan: ${LLM_BUDGET_PLAN_CNY:}

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # deepseek-flash 对应模型版本 DeepSeek-V4.1-Flash
    model: ${DEEPSEEK_MODEL:deepseek-flash}
