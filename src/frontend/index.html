<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fa" />
    <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg" />
    <title>Kexu · 课表、待办与专注</title>
    <script>
      // 在样式与脚本加载前应用主题，避免深色用户看到白色闪屏。
      try {
        var mode = localStorage.getItem('timetable-theme')
        if (mode === 'dark' || mode === 'light') document.documentElement.dataset.theme = mode
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f5f8fa; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #101d27; }
      #root { min-height: 100vh; }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #52606b;
        font: 400 14px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html[data-theme='dark'] .boot-splash { color: #97afbb; }
      .boot-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(22, 125, 154, 0.2);
        border-top-color: #167d9a;
        animation: boot-spin 0.9s linear infinite;
      }
      html[data-theme='dark'] .boot-spinner {
        border-color: rgba(105, 198, 213, 0.22);
        border-top-color: #69c6d5;
      }
      .boot-message {
        margin: 0;
        white-space: nowrap;
        letter-spacing: 0.02em;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; border-top-color: inherit; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p class="boot-message">完美人生正在到来</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
