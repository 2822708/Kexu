<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fa" />
    <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg" />
    <title>Kexu · 课表、待办与专注</title>
    <script src="/boot.js"></script>
    <style>
      html, body { margin: 0; background: #f5f8fa; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #101d27; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        color: #52606b;
        font: 400 14px/1.6 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot-status:not([hidden]) {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      html[data-theme='dark'] .boot-splash { color: #97afbb; }
      .boot-spinner {
        box-sizing: border-box;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(22, 125, 154, 0.2);
        border-top-color: #167d9a;
        animation: boot-spin 0.9s linear infinite;
      }
      html[data-theme='dark'] .boot-spinner {
        border-color: rgba(105, 198, 213, 0.22);
        border-top-color: #69c6d5;
      }
      .boot-message {
        margin: 0;
        letter-spacing: 0.02em;
      }
      .boot-error { max-width: 30em; }
      .boot-error p { margin: 0 0 16px; overflow-wrap: anywhere; }
      .boot-error button {
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; border-top-color: inherit; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div id="boot-start-status" class="boot-status" role="status">
          <span class="boot-spinner" aria-hidden="true"></span>
          <p class="boot-message">完美人生正在到来</p>
        </div>
        <div id="boot-start-error" class="boot-error" hidden>
          <p role="alert"><strong>Kexu 启动失败</strong><br />页面资源暂时无法加载，请重新打开。</p>
          <button id="boot-start-retry" type="button">重新加载</button>
        </div>
        <noscript>
          <style>#boot-start-status { display: none; }</style>
          <p>请启用 JavaScript 后重新打开 Kexu。</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
