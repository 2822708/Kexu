# Enable only for this new hostname. This bootstrap configuration serves ACME, not the app.
# Replace this same site file with nginx-https.conf.template only after a real certificate exists.
log_format kexu_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name timetable.zozovip.work;
    access_log /var/log/nginx/timetable.access.log kexu_private;
    error_log /var/log/nginx/timetable.error.log error;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/timetable/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "nginx bootstrap ready\n";
    }
    location / {
        default_type text/plain;
        return 503 "HTTPS setup is required before opening Kexu.\n";
    }
}
