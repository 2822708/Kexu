name: Android APK verification

on:
  push:
    branches:
      - ci/android-apk-build-20261017
  pull_request:
    paths:
      - 'src/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compile, test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/android
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      # The repository does not yet contain gradlew or gradle-wrapper.jar.
      # Use an explicitly pinned Gradle distribution until a verified
      # official wrapper can be committed.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Android unit tests and assemble APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Check APK and produce checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          path: |
            src/android/app/build/outputs/apk/debug/app-debug.apk
            src/android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
