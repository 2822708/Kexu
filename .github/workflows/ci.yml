name: CI

on:
  push:
    branches: [main, fix/complete-optimization-plan, feature/local-first-snapshots]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - name: Test and build backend
        working-directory: src/backend
        run: ./mvnw -B package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck
      - name: Lint
        working-directory: src/frontend
        run: npm run lint
      - name: Check Kexu product naming
        run: node scripts/check-brand.mjs
      - name: Local data, backup, AI and PWA regression
        working-directory: src/frontend
        run: node --test scripts/test-local-core.mjs scripts/test-snapshots.mjs scripts/test-local-ai.mjs scripts/test-daily-core.mjs scripts/test-daily-review.mjs scripts/test-native-export.mjs scripts/test-pwa.mjs scripts/test-day-agenda.mjs scripts/test-device-session.mjs scripts/test-timetable-layout.mjs scripts/test-chat-import.mjs
      - name: Build
        working-directory: src/frontend
        run: npm run build
      - name: Build offline mobile application
        working-directory: src/frontend
        run: npm run build:mobile
      - name: Build bundled native-shell application
        working-directory: src/frontend
        run: npm run build:shell

  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test encrypted object service
        working-directory: src/cloud
        run: npm test
      - name: Check deployment boundaries and standalone package
        run: node --test deployment/local-first/test-config.mjs
